name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Glove80 dongle firmware
        run: |
          nix-build config -A left   -o result-left
          nix-build config -A right  -o result-right
          nix-build config -A dongle -o result-dongle
      - name: Copy results out of nix store
        run: |
          cp result-left/zmk.uf2   glove80_left.uf2
          cp result-right/zmk.uf2  glove80_right.uf2
          cp result-dongle/zmk.uf2 glove80_dongle.uf2
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: glove80-dongle-firmware
          path: |
            glove80_left.uf2
            glove80_right.uf2
            glove80_dongle.uf2

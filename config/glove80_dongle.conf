CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# USB serial logging (reads at /dev/ttyACM0 or /dev/cu.usbmodem* at 115200)
CONFIG_LOG=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=4096

# Log level INFO. ZMK pins its own level to 4 (DEBUG) unless LOGGING_MINIMAL=y,
# so CONFIG_ZMK_LOG_LEVEL_INF=y alone has no effect. DEBUG logs every keystroke
# to a world-readable device node and drops messages (including the battery
# heartbeat) during typing bursts.
# To debug: comment out the next line.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y

# G80BAT battery heartbeat on the serial log (docs/battery-telemetry.md)
CONFIG_GLOVE80_BATTERY_TELEMETRY=y
CONFIG_GLOVE80_BATTERY_HEARTBEAT_MS=10000
